services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: integrant-web:latest
    container_name: integrant-web
    ports:
      - "8080:80"
    restart: unless-stopped
    profiles: ["prod"]

  web-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: integrant-web-dev:latest
    container_name: integrant-web-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host 0.0.0.0
    profiles: ["dev"]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: integrant-api:latest
    container_name: integrant-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=integrant
      - DB_USERNAME=integrant
      - DB_PASSWORD=secret
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["dev", "prod", "api"]

  db:
    image: postgres:16-alpine
    container_name: integrant-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=integrant
      - POSTGRES_USER=integrant
      - POSTGRES_PASSWORD=secret
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integrant -d integrant"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    profiles: ["dev", "prod", "api"]

volumes:
  db-data:
