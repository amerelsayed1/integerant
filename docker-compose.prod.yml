services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: integrant-frontend:latest
    container_name: integrant-frontend
    networks:
      - default
      - shared-web
    depends_on:
      - api-nginx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  api-nginx:
    image: nginx:1.27-alpine
    container_name: integrant-api-nginx
    volumes:
      - ./docker/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
      - laravel_storage:/var/www/html/storage:ro
    networks:
      - default
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: integrant-app:latest
    container_name: integrant-app
    volumes:
      - laravel_storage:/var/www/html/storage
    env_file: .env.prod
    networks:
      - default
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: integrant-db
    volumes:
      - db_data:/var/lib/postgresql/data
    env_file: .env.prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integrant -d integrant"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
    restart: unless-stopped

networks:
  default:
  shared-web:
    external: true
    name: shared-web

volumes:
  db_data:
  laravel_storage:
