  <path d="M74 18 H91 L31 80 H48 Z" fill="#49B6FF" opacity="0.92"/>
</g>
</g>
<text x="256" y="230" text-anchor="middle" fill="#FFFFFF" font-family="DM Sans, Inter, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.6">Bunyan<tspan fill="#0A84FF">X</tspan></text>
<text x="256" y="282" text-anchor="middle" fill="#FFFFFF" font-family="Tajawal, Cairo, Arial, sans-serif" font-size="44" font-weight="700">بنيان <tspan fill="#0A84FF">إكس</tspan></text>
<text x="256" y="326" text-anchor="middle" fill="#B8C0CC" font-family="DM Sans, Inter, Arial, sans-serif" font-size="18" font-weight="500">Build Smart. Scale Further.</text>

