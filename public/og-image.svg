<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Integrant — Software Solutions and Consulting">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.8">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo block: scaled-up version of the brand mark -->
  <g transform="translate(120, 150) scale(6)">
    <rect width="32" height="32" rx="8" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="7" y="10" width="4" height="16" rx="1" fill="#ffffff"/>
    <rect x="21" y="10" width="4" height="16" rx="1" fill="#ffffff"/>
    <path d="M9 10 L23 26" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M8 10 L5.5 5.5" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
    <path d="M10.5 10 L13 5.5" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
    <circle cx="5" cy="5" r="1.5" fill="#3b82f6"/>
    <circle cx="13.5" cy="5" r="1.5" fill="#3b82f6"/>
  </g>

  <!-- Wordmark + tagline -->
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="120" y="430" fill="#ffffff" font-size="84" font-weight="800" letter-spacing="-2">
      Integr<tspan fill="#3b82f6">ant</tspan>
    </text>
    <text x="120" y="490" fill="#cbd5e1" font-size="34" font-weight="500">
      Software Solutions &amp; Consulting
    </text>
    <text x="120" y="540" fill="#94a3b8" font-size="24" font-weight="400">
      Building software that scales your business.
    </text>
  </g>

  <!-- Accent bar -->
  <rect x="120" y="565" width="120" height="6" rx="3" fill="#3b82f6"/>
</svg>
